name: Governance Gate

# Reusable server-side checks that local hooks cannot guarantee (hooks are skippable with --no-verify).
# Callers: jobs.<id>.uses: kolade-ogunleye/agent-governance/.github/workflows/governance-gate.yml@<commit-sha>
on:
  workflow_call:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Gitleaks (checksum verified)
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_LINUX_X64_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Scan full history for secrets
        run: gitleaks git --no-banner --redact --exit-code 1 .

  branch-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Enforce semantic branch name
        env:
          # Passed via env, never interpolated into the script, to prevent injection through branch names.
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [[ ! "$HEAD_REF" =~ ^(feat|fix|patch|hotfix|refactor|chore|test)/[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$ ]]; then
            echo "::error::Branch '$HEAD_REF' violates the semantic branching policy (feat|fix|patch|hotfix|refactor|chore|test)/<slug>."
            exit 1
          fi
          echo "Branch '$HEAD_REF' follows the semantic branching policy."
