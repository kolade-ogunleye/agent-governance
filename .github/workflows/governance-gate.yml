name: Governance Gate

# Reusable server-side checks that local hooks cannot guarantee (hooks are skippable with --no-verify).
# Callers: jobs.<id>.uses: kolade-ogunleye/agent-governance/.github/workflows/governance-gate.yml@<commit-sha>
#          with a `secrets: hub_token: ...` read-only token when the hub repository is private.
on:
  workflow_call:
    inputs:
      hub_repository:
        description: Hub repository (owner/name) that the caller's .agent-governance.lock refers to.
        type: string
        default: kolade-ogunleye/agent-governance
      hub_max_age_warn_days:
        description: Warn when the hub commit recorded in .agent-governance.lock is older than this many days.
        type: number
        default: 30
      hub_max_age_fail_days:
        description: Fail when the hub commit recorded in .agent-governance.lock is older than this many days.
        type: number
        default: 90
      full_history_secret_scan:
        description: Scan the entire history instead of only the commits a pull request or push introduces.
        type: boolean
        default: false
    secrets:
      hub_token:
        description: Read-only contents token for the hub. Required only when the hub repository is private.
        required: false

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Gitleaks (checksum verified)
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_LINUX_X64_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Scan for secrets
        # Pull requests and pushes scan only the commits they introduce, so known, tracked historical
        # findings do not block every change; schedule, manual runs, and full_history_secret_scan scan
        # all history. Event values arrive via env and are validated as SHAs before use.
        env:
          EVENT_NAME: ${{ github.event_name }}
          FULL_HISTORY: ${{ inputs.full_history_secret_scan }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          is_commit() { [[ "$1" =~ ^[0-9a-f]{40}$ && ! "$1" =~ ^0+$ ]] && git cat-file -e "$1^{commit}" 2>/dev/null; }
          range=""
          if [[ "$FULL_HISTORY" != "true" ]]; then
            if [[ "$EVENT_NAME" == "pull_request" ]] && is_commit "$PR_BASE_SHA" && is_commit "$PR_HEAD_SHA"; then
              range="$PR_BASE_SHA..$PR_HEAD_SHA"
            elif [[ "$EVENT_NAME" == "push" ]] && is_commit "$PUSH_BEFORE_SHA" && is_commit "$PUSH_AFTER_SHA"; then
              range="$PUSH_BEFORE_SHA..$PUSH_AFTER_SHA"
            fi
          fi
          if [[ -n "$range" ]]; then
            echo "Scanning commits in $range"
            gitleaks git --no-banner --redact --exit-code 1 --log-opts="$range" .
          else
            echo "Scanning full history (event: $EVENT_NAME)"
            gitleaks git --no-banner --redact --exit-code 1 .
          fi

  branch-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Enforce semantic branch name
        env:
          # Passed via env, never interpolated into the script, to prevent injection through branch names.
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          # dependabot/ is GitHub's own prefix for Dependabot pull requests (.github/dependabot.yml).
          if [[ ! "$HEAD_REF" =~ ^(feat|fix|patch|hotfix|refactor|chore|test|dependabot)/[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$ ]]; then
            echo "::error::Branch '$HEAD_REF' violates the semantic branching policy (feat|fix|patch|hotfix|refactor|chore|test)/<slug>."
            exit 1
          fi
          echo "Branch '$HEAD_REF' follows the semantic branching policy."

  integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read locked hub commit
        id: lock
        shell: pwsh
        env:
          # True when the caller is the hub itself (its ci.yml calls this gate from a local path). The hub
          # verifies its root copies against its own template and must always carry a lock.
          IS_HUB: ${{ github.repository == job.workflow_repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $isHub = $env:IS_HUB -eq 'true'
          "is_hub=$(if ($isHub) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT
          if (-not (Test-Path -LiteralPath '.agent-governance.lock')) {
              if ($isHub) {
                  Write-Host "::error::The hub must carry its own .agent-governance.lock. Run Sync-AgentGovernance -RepoPath . from the hub root and commit the result."
                  "present=false" >> $env:GITHUB_OUTPUT
                  exit 1
              }
              Write-Host "::notice::No .agent-governance.lock; governance integrity check skipped."
              "present=false" >> $env:GITHUB_OUTPUT
              exit 0
          }
          $commit = [string](Get-Content -LiteralPath '.agent-governance.lock' -Raw | ConvertFrom-Json).hub.commit
          # The lock is repository content: accept only a full commit SHA before using it as a checkout ref.
          if ($commit -notmatch '^[0-9a-f]{40}$') {
              Write-Host "::error::.agent-governance.lock hub.commit must be a 40-character commit SHA."
              exit 1
          }
          "present=true" >> $env:GITHUB_OUTPUT
          "commit=$commit" >> $env:GITHUB_OUTPUT

      - name: Checkout hub at the locked commit
        id: hub
        if: steps.lock.outputs.present == 'true' && steps.lock.outputs.is_hub != 'true'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The gate's own repository (trusted) rather than a caller-supplied input, when available.
          repository: ${{ job.workflow_repository || inputs.hub_repository }}
          ref: ${{ steps.lock.outputs.commit }}
          path: _governance_hub
          token: ${{ secrets.hub_token || github.token }}
          persist-credentials: false

      - name: Check hub pin consistency and freshness
        # Not for the hub: its lock records the commit the sync ran from, which is by construction older than
        # the commit under test, and freshness measures a downstream repository's distance from the hub.
        if: steps.lock.outputs.present == 'true' && steps.lock.outputs.is_hub != 'true' && steps.hub.outcome == 'success'
        shell: pwsh
        env:
          HUB_DIR: _governance_hub
          LOCK_COMMIT: ${{ steps.lock.outputs.commit }}
          GATE_SHA: ${{ job.workflow_sha }}
          WARN_DAYS: ${{ inputs.hub_max_age_warn_days }}
          FAIL_DAYS: ${{ inputs.hub_max_age_fail_days }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Sync writes the lock and the gate pin together, so a mismatch means a partial edit or a downgrade.
          if ($env:GATE_SHA -match '^[0-9a-f]{40}$' -and $env:LOCK_COMMIT -ne $env:GATE_SHA) {
              Write-Host "::error::.agent-governance.lock hub.commit $($env:LOCK_COMMIT) does not match the gate pin $($env:GATE_SHA). Re-run Sync-AgentGovernance instead of editing either by hand."
              exit 1
          }
          $committed = [DateTimeOffset]::FromUnixTimeSeconds([long]"$(git -C $env:HUB_DIR log -1 --format=%ct)".Trim())
          $ageDays = [int][Math]::Floor(([DateTimeOffset]::UtcNow - $committed).TotalDays)
          if ($ageDays -gt [int]$env:FAIL_DAYS) {
              Write-Host "::error::The locked hub commit is $ageDays days old (older than $($env:FAIL_DAYS) days). Re-sync from the current hub."
              exit 1
          }
          if ($ageDays -gt [int]$env:WARN_DAYS) {
              Write-Host "::warning::The locked hub commit is $ageDays days old (older than $($env:WARN_DAYS) days). Re-sync from the current hub soon."
          }
          Write-Host "Hub pin consistent; locked hub commit is $ageDays days old."

      - name: Fail on an unreachable hub
        # Fail closed: a governed repository (it has a lock) whose hub cannot be fetched has not been verified, and
        # a required check must not report success for a verification it skipped.
        if: steps.lock.outputs.present == 'true' && steps.lock.outputs.is_hub != 'true' && steps.hub.outcome != 'success'
        env:
          # Via env, never interpolated into the script, to prevent injection through the input.
          HUB_REPOSITORY: ${{ inputs.hub_repository }}
        run: |
          echo "::error::Could not fetch ${HUB_REPOSITORY} at the locked commit, so managed files were not verified. Set a read-only AGENT_GOVERNANCE_HUB_TOKEN secret (private hub: Contents read on the hub only) and make sure the locked commit is pushed."
          exit 1

      - name: Verify managed files against the hub template
        if: steps.lock.outputs.present == 'true' && steps.lock.outputs.is_hub != 'true' && steps.hub.outcome == 'success'
        shell: pwsh
        # Runs the hub's own verifier: the caller's copy could itself have been modified.
        run: ./_governance_hub/template/scripts/guardrails/verify-governance.ps1 -HubTemplate ./_governance_hub/template

      - name: Verify the hub's own root copies against its template
        if: steps.lock.outputs.present == 'true' && steps.lock.outputs.is_hub == 'true'
        shell: pwsh
        # Dogfooding: the hub's AGENTS.md, rules, guardrails and agent settings must equal template/ and the lock.
        run: ./template/scripts/guardrails/verify-governance.ps1 -HubTemplate ./template
