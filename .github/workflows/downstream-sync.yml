name: Downstream Sync

# Reusable: a private operations repository calls this weekly with its fleet list, pinned to a hub release commit:
#   jobs.sync.uses: <owner>/agent-governance/.github/workflows/downstream-sync.yml@<release-commit-sha>
# The hub is public, so its own workflow logs are public. Calling from a private repository keeps fleet names, sync
# results and audit findings in that repository's private logs, and pinning to a release means hub changes reach the
# fleet (and run with the App key) only after a release the owner merged into the operations repository.
# For each repository it re-syncs from the calling hub commit, opening or updating one pull request, applies the
# default-branch ruleset where the plan supports it, and audits the provenance of recently merged pull requests.
# Credentials, in order of preference:
#   1. A GitHub App (input app_client_id + secret AGENT_GOVERNANCE_APP_PRIVATE_KEY): each job mints a short-lived
#      installation token scoped to the one repository it touches. Install the App on the hub and the fleet
#      repositories with Contents, Workflows, Pull requests, Issues, Administration read/write and Actions read.
#   2. The AGENT_GOVERNANCE_SYNC_TOKEN secret: a fine-grained token limited to the hub and the fleet repositories
#      with the same permissions. Long-lived, so prefer the App.
# Without either, the jobs warn and skip.
on:
  workflow_call:
    inputs:
      fleet:
        description: JSON array of owner/name repositories to keep in sync.
        type: string
        required: true
      app_client_id:
        description: The GitHub App's client ID (not a secret).
        type: string
        default: ""
    secrets:
      AGENT_GOVERNANCE_APP_PRIVATE_KEY:
        required: false
      AGENT_GOVERNANCE_SYNC_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      repositories: ${{ steps.fleet.outputs.repositories }}
      hub_name: ${{ steps.fleet.outputs.hub_name }}
    steps:
      - name: Validate the fleet list
        id: fleet
        shell: pwsh
        env:
          # Via env, never interpolated into the script: the list is caller input.
          FLEET: ${{ inputs.fleet }}
          HUB_REPOSITORY: ${{ job.workflow_repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repos = @($env:FLEET | ConvertFrom-Json)
          if ($repos.Count -eq 0) { throw 'The fleet list is empty.' }
          $seen = @{}
          $entries = foreach ($r in $repos) {
              if ("$r" -notmatch '^([A-Za-z0-9._-]+)/([A-Za-z0-9._-]+)$') { throw "Invalid fleet entry: $r" }
              # GitHub names are case-insensitive, and a duplicate would open competing sync pull requests.
              if ($seen.ContainsKey("$r".ToLowerInvariant())) { throw "Duplicate fleet entry: $r" }
              $seen["$r".ToLowerInvariant()] = $true
              # The App token step needs the bare repository name; the rest of the job uses owner/name.
              [pscustomobject]@{ full = "$r"; name = $Matches[2] }
          }
          "repositories=$(ConvertTo-Json -InputObject @($entries) -Compress)" >> $env:GITHUB_OUTPUT
          "hub_name=$(($env:HUB_REPOSITORY -split '/')[1])" >> $env:GITHUB_OUTPUT

  sync:
    needs: plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repository: ${{ fromJSON(needs.plan.outputs.repositories) }}
    steps:
      - name: Mint a GitHub App installation token scoped to this repository
        id: app
        if: inputs.app_client_id != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.app_client_id }}
          private-key: ${{ secrets.AGENT_GOVERNANCE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.repository.name }}
          # Least privilege: the token carries only what this job uses, whatever the installation holds.
          permission-contents: write
          # Every sync updates the pinned gate in .github/workflows/agent-governance.yml; GitHub refuses a push
          # that changes a workflow file without this permission.
          permission-workflows: write
          permission-pull-requests: write
          permission-issues: write
          permission-administration: write
          permission-metadata: read

      - name: Resolve the sync credential (App installation token, else the personal access token)
        id: token
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
          HAS_PAT: ${{ secrets.AGENT_GOVERNANCE_SYNC_TOKEN != '' }}
        run: |
          if [ -n "${APP_TOKEN}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"; echo "source=app" >> "$GITHUB_OUTPUT"
          elif [ "${HAS_PAT}" = "true" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"; echo "source=pat" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"; echo "source=none" >> "$GITHUB_OUTPUT"
            echo "::warning::Neither a GitHub App (app_client_id / AGENT_GOVERNANCE_APP_PRIVATE_KEY) nor AGENT_GOVERNANCE_SYNC_TOKEN is set; skipping downstream sync."
          fi

      - name: Checkout hub at the calling commit (full history, so the pinned commit is known to be pushed)
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 0
          path: hub
          persist-credentials: false

      - name: Checkout downstream repository
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repository.full }}
          token: ${{ steps.app.outputs.token || secrets.AGENT_GOVERNANCE_SYNC_TOKEN }}
          fetch-depth: 0
          path: downstream

      - name: Sync and open or update the pull request
        if: steps.token.outputs.present == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.AGENT_GOVERNANCE_SYNC_TOKEN }}
          GH_REPO: ${{ matrix.repository.full }}
          # An App token has no "@me"; assign the pull request to the repository owner instead.
          SYNC_ASSIGNEE: ${{ steps.token.outputs.source == 'app' && github.repository_owner || '@me' }}
        run: |
          $ErrorActionPreference = 'Stop'
          git -C downstream config user.name 'agent-governance-sync'
          git -C downstream config user.email 'agent-governance-sync@users.noreply.github.com'
          $result = ./hub/Invoke-DownstreamSync.ps1 -RepoPath downstream -InstallFormatter -Assignee $env:SYNC_ASSIGNEE
          Write-Host "$($env:GH_REPO): $($result.Action) $($result.Branch)"
          $closed = if ($result.Superseded) { " (closed superseded: #$($result.Superseded -join ', #'))" } else { '' }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- **$($env:GH_REPO)**: $($result.Action) $($result.Branch)$closed"

      - name: Enforce the default-branch ruleset where the plan supports it
        if: steps.token.outputs.present == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.AGENT_GOVERNANCE_SYNC_TOKEN }}
          REPOSITORY: ${{ matrix.repository.full }}
        run: |
          $ErrorActionPreference = 'Stop'
          $result = ./hub/Set-GovernanceRuleset.ps1 -Repository $env:REPOSITORY -Confirm:$false
          Write-Host "$($env:REPOSITORY): ruleset $($result.Status) $($result.Action)"

  provenance-audit:
    # Detects, from outside each governed repository, a merged pull request whose required governance checks were
    # not produced by the hub gate, or whose caller workflow differs from the hub template. Rulesets match checks by
    # name, and required workflows (which would prevent this) exist only for organizations.
    needs: plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repository: ${{ fromJSON(needs.plan.outputs.repositories) }}
    steps:
      - name: Mint a read-only GitHub App installation token scoped to this repository
        id: app
        if: inputs.app_client_id != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.app_client_id }}
          private-key: ${{ secrets.AGENT_GOVERNANCE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.repository.name }}
          permission-actions: read
          permission-contents: read
          permission-pull-requests: read
          permission-metadata: read

      - name: Warn when the audit cannot run
        if: steps.app.outputs.token == ''
        run: echo "::warning::The provenance audit needs the GitHub App (app_client_id / AGENT_GOVERNANCE_APP_PRIVATE_KEY); skipped."

      - name: Checkout hub at the calling commit (full history, to render the caller template at any pinned commit)
        if: steps.app.outputs.token != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Audit the provenance of required checks on recently merged pull requests
        if: steps.app.outputs.token != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPOSITORY: ${{ matrix.repository.full }}
          HUB_REPOSITORY: ${{ job.workflow_repository }}
        run: ./Test-GateProvenance.ps1 -Repository $env:REPOSITORY -HubRepository $env:HUB_REPOSITORY -SinceDays 8

  enforce-hub:
    needs: plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Mint a GitHub App installation token scoped to the hub
        id: app
        if: inputs.app_client_id != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.app_client_id }}
          private-key: ${{ secrets.AGENT_GOVERNANCE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ needs.plan.outputs.hub_name }}
          permission-administration: write
          permission-contents: read
          permission-metadata: read

      - name: Resolve the credential (App installation token, else the personal access token)
        id: token
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
          HAS_PAT: ${{ secrets.AGENT_GOVERNANCE_SYNC_TOKEN != '' }}
        run: |
          if [ -n "${APP_TOKEN}" ] || [ "${HAS_PAT}" = "true" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Neither a GitHub App nor AGENT_GOVERNANCE_SYNC_TOKEN is set; skipping hub ruleset enforcement."
          fi

      - name: Checkout hub at the calling commit
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false

      - name: Enforce the hub's default-branch ruleset where the plan supports it
        if: steps.token.outputs.present == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.AGENT_GOVERNANCE_SYNC_TOKEN }}
          HUB_REPOSITORY: ${{ job.workflow_repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          # macOS runs on every pull request but is deliberately not required: it is the slowest job and must not hold up merges.
          $checks = @('governance-gate / secret-scan', 'governance-gate / integrity', 'verify (ubuntu-latest)', 'verify (windows-latest)')
          $result = ./Set-GovernanceRuleset.ps1 -Repository $env:HUB_REPOSITORY -Confirm:$false -RequiredCheck $checks
          Write-Host "$($env:HUB_REPOSITORY): ruleset $($result.Status) $($result.Action)"

  toolchain-freshness:
    # Advisory: the pinned tool versions (Pester, PSScriptAnalyzer, Prettier, Gitleaks, Lefthook) are not
    # Dependabot ecosystems, so this compares them with the latest releases and warns in the run summary.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hub at the calling commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false

      - name: Compare pinned tool versions with the latest releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./Test-ToolchainFreshness.ps1
