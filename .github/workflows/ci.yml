name: Governance Engine CI

on:
  push:
    branches: [main, feat/*, chore/*, fix/*]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lefthook & Gitleaks (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          winget install evilmartians.lefthook --accept-source-agreements --accept-package-agreements
          winget install Gitleaks.Gitleaks --accept-source-agreements --accept-package-agreements

      - name: Install Lefthook & Gitleaks (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -sSfL https://raw.githubusercontent.com/evilmartians/lefthook/master/bin/install.sh | sudo sh -s -- -d -b /usr/local/bin
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks

      - name: Verify PowerShell Scripts syntax
        shell: pwsh
        run: |
          $scripts = Get-ChildItem -Path . -Filter "*.ps1" -Recurse
          foreach ($script in $scripts) {
              Write-Host "Validating $($script.FullName)..."
              $null = [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$null, [ref]$null)
          }
          Write-Host "All PowerShell scripts passed syntax validation."

      - name: Verify Markdown LF Line Endings & Encoding
        shell: pwsh
        run: |
          ./scripts/guardrails/check-markdown.ps1

      - name: Verify Prettier Markdown Formatting
        run: |
          npx prettier --check "**/*.md"
