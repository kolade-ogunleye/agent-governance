name: Governance Engine CI

# Pull requests run CI once per push (branch pushes no longer trigger a second, duplicate run);
# merges to main run the full matrix including macOS, which bills about 10x Linux per minute.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same pull request cancels the superseded run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PESTER_VERSION: "6.2.0"
  PSSA_VERSION: "1.25.0"
  PRETTIER_VERSION: "3.9.9"
  # Analyzer warnings allowed; held at 0 so any new warning fails CI.
  PSSA_WARNING_BASELINE: "0"

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'push' && '["windows-latest", "ubuntu-latest", "macos-latest"]' || '["windows-latest", "ubuntu-latest"]') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned PowerShell test tooling
        shell: pwsh
        run: |
          Install-PSResource -Name Pester -Version $env:PESTER_VERSION -TrustRepository -Scope CurrentUser
          Install-PSResource -Name PSScriptAnalyzer -Version $env:PSSA_VERSION -TrustRepository -Scope CurrentUser

      - name: Verify PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          foreach ($script in Get-ChildItem -Path . -Include *.ps1, *.psd1 -Recurse -File) {
              $tokens = $null
              $errors = $null
              $null = [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$errors)
              foreach ($e in $errors) {
                  Write-Host "::error file=$($script.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"
                  $failed = $true
              }
          }
          if ($failed) { exit 1 }
          Write-Host "All PowerShell scripts parsed without errors."

      - name: Static analysis (PSScriptAnalyzer)
        shell: pwsh
        run: |
          Import-Module PSScriptAnalyzer -RequiredVersion $env:PSSA_VERSION
          $findings = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $findings | Format-Table Severity, RuleName, ScriptName, Line -AutoSize | Out-String -Width 200 | Write-Host
          $errorCount = @($findings | Where-Object Severity -eq 'Error').Count
          $warningCount = @($findings | Where-Object Severity -eq 'Warning').Count
          if ($errorCount -gt 0) { Write-Host "::error::$errorCount analyzer error(s)."; exit 1 }
          if ($warningCount -gt [int]$env:PSSA_WARNING_BASELINE) {
              Write-Host "::error::$warningCount analyzer warnings exceed baseline $($env:PSSA_WARNING_BASELINE)."
              exit 1
          }

      - name: Unit & integration tests (Pester)
        shell: pwsh
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "CI"
          git config --global init.defaultBranch main
          Import-Module Pester -RequiredVersion $env:PESTER_VERSION
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          Invoke-Pester -Configuration $config

      - name: Verify Markdown LF line endings & encoding
        shell: pwsh
        run: ./scripts/guardrails/check-markdown.ps1

      - name: Verify Prettier Markdown formatting
        if: runner.os == 'Linux'
        run: npx --yes "prettier@${PRETTIER_VERSION}" --check "**/*.md"

  governance-gate:
    # Dogfoods the reusable gate that downstream repositories call.
    uses: ./.github/workflows/governance-gate.yml
    permissions:
      contents: read
